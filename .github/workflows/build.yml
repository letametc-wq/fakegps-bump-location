
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FakeGPS_BumpLocation_Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -q FakeGPS_BumpLocation_Source.zip
          test -f FakeGPS_BumpLocation/app/build.gradle.kts

      - name: Align Java compile target with Kotlin
        run: |
          cat >> FakeGPS_BumpLocation/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
          }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon -p FakeGPS_BumpLocation assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-BumpLocation-debug-apk
          path: FakeGPS_BumpLocation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
