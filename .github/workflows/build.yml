name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FakeGPS_BumpLocation_Source_v1.1.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract v1.1 Android project
        run: |
          unzip -q FakeGPS_BumpLocation_Source_v1.1.zip
          test -f FakeGPS_BumpLocation/app/build.gradle.kts
          test -f FakeGPS_BumpLocation/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_MOCK_LOCATION' FakeGPS_BumpLocation/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon -p FakeGPS_BumpLocation assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-BumpLocation-v1.1-debug-apk
          path: FakeGPS_BumpLocation/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
